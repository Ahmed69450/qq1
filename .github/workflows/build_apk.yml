name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Flutter Android Platform
        run: |
          mkdir -p /tmp/backup_kt
          cp -r android/app/src/main/kotlin/* /tmp/backup_kt/ 2>/dev/null || true
          flutter create --org com.byd --project-name offline_car_assistant .
          cp -r /tmp/backup_kt/* android/app/src/main/kotlin/ 2>/dev/null || true
          
          # Ensure permissions in AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>' android/app/src/main/AndroidManifest.xml
          
          flutter pub get

      - name: Build APK (Release)
        run: |
          flutter build apk --release

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: byd-assistant-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "BYD Assistant Release APK v1.0.0"
          body: "Official Release APK for BYD DiLink Head Unit (Android 10+)"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
